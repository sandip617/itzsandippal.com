<body>
  <p id="msg">আজকের সংস্করণ খোলা হচ্ছে…</p>
  <noscript><a href="https://sandip617.github.io/news-board/?stay">News Board খুলুন</a></noscript>
  <script>
    // News Board lives in the sandip617/news-board repo (GitHub Pages).
    // This page loads that board live so it always shows the latest version and edition,
    // while the address stays itzsandippal.com/newsboard.
    (function () {
      var SRC = "https://sandip617.github.io/news-board/";
      fetch(SRC + "index.html", { cache: "no-cache" })
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
        .then(function (html) { document.open(); document.write(html); document.close(); })
        .catch(function () { location.replace(SRC + "?stay" + location.hash); });
    })();
  </script>
</body>
